name: CPU contracts and evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU development environment
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.5.2 pytest==9.1.1
      - name: Test contracts, runners, and curated evidence
        run: python -m pytest tests -q
      - name: Check publication hygiene
        run: python tools/check_publication.py
